<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    The Calibrate mark: a circle resting on a full-width bar, with a triangle
    beneath it — the fulcrum the bar balances on. Geometry is from
    public/icons/icon.svg, which is the source drawing for every icon on the
    site. Next.js serves this file as the favicon through the App Router
    `app/icon.svg` convention.

    The background stays transparent so the mark sits directly on the browser's
    own tab strip, and the fill follows `prefers-color-scheme` so it stays
    legible in both: #141414 is the light theme ink, #E6E9ED the dark theme
    ink, matching the ink token in app/globals.css. The `fill` attributes
    repeat the light value as a fallback for any renderer that drops <style>.

    This is the only file under the `icon` convention on purpose. Next.js
    emits one <link rel="icon"> per base name, so an `app/icon.png` beside it
    would win and the theme switch above would never run.

    The opaque rasters (app/apple-icon.png and public/icons/icon-*.png) use a
    black tile with a white mark instead, because PNG cannot switch on theme
    and iOS composites a transparent Apple touch icon onto black. They are
    generated from the same three shapes by scripts/render-icons.py; run that
    after changing the mark, or they will quietly disagree with this file.
  -->
  <style>
    .mark { fill: #141414; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #E6E9ED; }
    }
  </style>
  <rect class="mark" y="34" width="64" height="10" fill="#141414"/>
  <circle class="mark" cx="32" cy="20" r="14" fill="#141414"/>
  <path class="mark" d="M32 44L40.6603 59H23.3397L32 44Z" fill="#141414"/>
</svg>
